<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas #4</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="contenedor">

<!-- SECCIÓN 1: Búsqueda de Usuario -->
    <section class="seccion-busqueda">
      <h2>Buscar Usuario</h2>
      <div class="grupo-entrada">
        <input type="text" id="id-usuario" placeholder="Ingrese ID de usuario...">
        <button id="boton-buscar">Buscar</button>
      </div>
      <p id="mensaje-busqueda"></p>
    </section>

<hr>

<!-- SECCIÓN 2: Formulario de Tareas -->
  <section class="seccion-tareas">
    <h2>Registrar Nueva Tarea</h2>

    <form id="formulario-tareas" class="formulario-desactivado">
    
      <div class="grupo-entrada-tarea">
        <label class="grupo-entrada-tarea__subtitulos">Título de la Tarea:</label>
        <input type="text" id="titulo-tarea" placeholder="Ingrese el nombre de la tarea" required disabled>
      </div>

      <div class="grupo-entrada-tarea">
        <label class="grupo-entrada-tarea__subtitulos">Descripción:</label>
        <textarea id="descripcion-tarea" placeholder="Ingrese detalles de la tarea" required disabled></textarea>
      </div>
    
      <div class="contenedor-btn">
        <button type="submit" id="boton-guardar-tarea" disabled>Guardar Tarea</button>
        <button class="btn-actualizar" type="button" id="boton-actualizar-tarea">Actualizar</button>
        <button class="btn-eliminar" type="button" id="boton-eliminar-tarea">Eliminar</button>
      </div>
    </form>
  </section>

  <hr>

  <!-- SECCION 3: Filtros de Tareas -->
    <!-- SECCIÓN 3: Filtros -->
<section class="seccion-filtros">
  <h2>Filtrar Tareas</h2>
  <div class="contenedor-filtros">
    <div class="grupo-entrada">
      <label for="filtro-estado">Estado:</label>
      <select id="filtro-estado">
        <option value="">Todos</option>

        <option value="pendiente">Pendiente</option>

        <option value="en proceso">En Proceso</option>

        <option value="completada">Completada</option>
      </select>
    </div>
    <div class="grupo-entrada">
      <label for="filtro-usuario">Usuario:</label>
      <select id="filtro-usuario">

        <option value="">Todos</option>

        <option value="1">Usuario 1</option>

        <option value="2">Usuario 2</option>

        <option value="3">Usuario 3</option>

        <option value="4">Usuario 4</option>

        <option value="5">Usuario 5</option>

        <option value="6">Usuario 6</option>

        <option value="7">Usuario 7</option>

        <option value="8">Usuario 8</option>

        <option value="9">Usuario 9</option>

        <option value="10">Usuario 10</option>
      </select>
    </div>
  </div>
</section>

<hr>

<!-- Ordenamiento Dinámico -->
  <div class="contenedor-orden">
    <label for="orden-tareas">Ordenar por:</label>
    
    <select id="orden-tareas">
      <option value="">Seleccionar</option>

      <option value="fecha">Fecha de creación</option>

      <option value="nombre">Nombre de la tarea</option>

      <option value="estado">Estado</option>
  </select>
</div>

<!--LISTADO FUERA DEL FORM -->
  <h2>Tareas del Usuario</h2>
    <section class="seccion-lista">
      <div id="contenedor-tareas"></div>
    </section>
  </div>

  <script src="./main.js" type="module"></script>
</body>
</html>
